set noparent
# Google puts the project in front of the path in a header guard, as in
# ERRORGROUP_SRC_ERROR_GROUP_H_. cpplint derives the guard from the path below
# root, so root is the parent of the checkout, and the checkout has to be
# named ErrorGroup, as Arduino names the folder of the library anyway.
root=..
extensions=h,cpp,ino
# Arduino puts src/ itself on the include path, and a sketch includes its own
# files by name: "src/error_group.h" would not be found.
filter=-build/include_subdir
