sentence=Errors that carry the group they come from, Status and Result with a fluent API, and array and span for avr-gcc, which has no C++ standard library.
paragraph=An Error is a code within a group, identified by the group's address, so that a library or a sketch adds a group of its own without changing this one. Status and Result follow Rust: AndThen, Map, OrElse, ValueOr. array, span and make_array follow the standard, with at() and subspan() returning a Result instead of undefined behaviour.
